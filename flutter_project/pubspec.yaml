name: camscanner_pro
description: "All-in-One Document Scanner and Manager App in Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. Camera & Native Document Scanning
  camera: ^0.10.6
  google_mlkit_document_scanner: ^0.2.0
  image_picker: ^1.1.2

  # 2. Image Processing & Filters
  image: ^4.2.0

  # 3. OCR (Text Recognition)
  google_mlkit_text_recognition: ^0.13.0

  # 4. PDF Generation & Printing
  pdf: ^3.10.8
  printing: ^5.13.1

  # 5. Word (.docx) Document Generator & Zip Archive
  archive: ^3.6.1

  # 6. In-built PDF Viewer
  flutter_pdfview: ^1.3.2

  # 7. File Storage, Sharing & Permissions
  path_provider: ^2.1.3
  path: ^1.9.0
  permission_handler: ^11.3.1
  share_plus: ^9.0.0
  file_picker: ^8.0.5

  # 8. Icons & UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
