name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android environment
        run: flutter doctor -v

      - name: Check Flutter project directory
        run: |
          if [ -d "flutter_project" ]; then
            cd flutter_project
          fi
          flutter pub get

      - name: Build Android Release APK
        run: |
          if [ -d "flutter_project" ]; then
            cd flutter_project
          fi
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamScanner-Pro-Release-APK
          path: |
            flutter_project/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
